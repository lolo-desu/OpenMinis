name: Build iOS 15 IPA

on:
  push:
    branches: [ main, master, ios15-support ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go 1.25+
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'
          check-latest: true

      - name: Select Xcode & Check Versions
        run: |
          xcodebuild -version
          go version

      - name: Install Build Dependencies
        run: |
          brew install ninja llvm lld libarchive pkg-config
          ln -sf /opt/homebrew/opt/lld/bin/ld.lld /opt/homebrew/opt/llvm/bin/ld.lld || true
          ln -sf /opt/homebrew/opt/lld/bin/lld /opt/homebrew/opt/llvm/bin/lld || true
          echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          pip3 install --break-system-packages meson || pip3 install meson

      - name: Restore LAME & FFmpeg Cache
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks/FFmpeg.framework
            deps/frameworks/libavcodec.framework
            deps/frameworks/libavformat.framework
            deps/frameworks/libavutil.framework
            deps/frameworks/libavfilter.framework
            deps/frameworks/libswresample.framework
            deps/frameworks/libswscale.framework
          key: ios15-ffmpeg-v3-${{ hashFiles('deps/build_lame.sh', 'deps/build_ffmpeg.sh') }}

      - name: Build LAME & FFmpeg (if not cached)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh

      - name: Save LAME & FFmpeg Cache
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks/FFmpeg.framework
            deps/frameworks/libavcodec.framework
            deps/frameworks/libavformat.framework
            deps/frameworks/libavutil.framework
            deps/frameworks/libavfilter.framework
            deps/frameworks/libswresample.framework
            deps/frameworks/libswscale.framework
          key: ios15-ffmpeg-v3-${{ hashFiles('deps/build_lame.sh', 'deps/build_ffmpeg.sh') }}

      - name: Restore iSH, Rootfs & Rclone Cache
        id: cache-ish
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/resources
            deps/frameworks/Rclone.xcframework
          key: ios15-ish-rclone-v3-${{ hashFiles('deps/build_ish.sh', 'deps/prepare_alpine_rootfs.sh', 'deps/build_rclone_ios.sh', '.gitmodules') }}

      - name: Build iSH, Rootfs & Rclone (if not cached)
        if: steps.cache-ish.outputs.cache-hit != 'true'
        run: |
          export PATH="/opt/homebrew/opt/lld/bin:/opt/homebrew/opt/llvm/bin:$PATH"
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Save iSH, Rootfs & Rclone Cache
        if: steps.cache-ish.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/resources
            deps/frameworks/Rclone.xcframework
          key: ios15-ish-rclone-v3-${{ hashFiles('deps/build_ish.sh', 'deps/prepare_alpine_rootfs.sh', 'deps/build_rclone_ios.sh', '.gitmodules') }}

      - name: Prepare Configs
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build Minis App (Unsigned iOS 15.0+)
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "Minis.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          rm -rf "$APP_PATH/PlugIns/AgentWidgetExtension.appex"
          rm -rf "$APP_PATH/PlugIns/MinisFileProvider.appex"
          # [T-appgroup-container-nil-trap] Also drop the share extension.
          # It declares the same App Group, which an unsigned TrollStore
          # install cannot be granted; an appex whose group is missing is a
          # launch-time liability while we are still isolating why the host
          # process traps. Restore once the app itself boots cleanly.
          rm -rf "$APP_PATH/PlugIns/MinisShare.appex"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r9 ../Minis-iOS15-unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS15-IPA
          path: build/Minis-iOS15-unsigned.ipa
